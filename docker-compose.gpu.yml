# Оверлей для включения аппаратного ускорения NVIDIA GPU в контейнере anyjev
# Использование:
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  anyjev:
    environment:
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '${ANYJEV_GPU_UUID:-GPU-7b86aac7-cea5-5401-ceb0-463b5df668b1}' ]
              capabilities: [ gpu ]
