services:
  # ---------------------------------------------------------------------------
  # Redis: кэш и хранилище квот / rate limit для OmniRoute
  # ---------------------------------------------------------------------------
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - omniroute-redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - deepseek-net

  # ---------------------------------------------------------------------------
  # OmniRoute: шлюз / роутер AI моделей (OpenAI, DeepSeek, Anthropic, OpenRouter)
  # ---------------------------------------------------------------------------
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379
      - APP_BIND_HOST=${HOST_BIND_IP:-127.0.0.1}
      - DASHBOARD_PORT=${OMNIROUTE_DASHBOARD_PORT:-20128}
      - API_PORT=${OMNIROUTE_API_PORT:-20129}
      - LIVE_WS_PORT=${OMNIROUTE_LIVE_WS_PORT:-20132}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-false}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-}
      - OMNIROUTE_MEMORY_MB=${OMNIROUTE_MEMORY_MB:-2048}
      - TZ=${TZ:-Europe/Moscow}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${OMNIROUTE_DASHBOARD_PORT:-20128}:${OMNIROUTE_DASHBOARD_PORT:-20128}"
      - "${HOST_BIND_IP:-127.0.0.1}:${OMNIROUTE_API_PORT:-20129}:${OMNIROUTE_API_PORT:-20129}"
      - "${HOST_BIND_IP:-127.0.0.1}:${OMNIROUTE_LIVE_WS_PORT:-20132}:${OMNIROUTE_LIVE_WS_PORT:-20132}"
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "healthcheck.mjs" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - deepseek-net

  # ---------------------------------------------------------------------------
  # Workspace-init: автоматическая настройка прав доступа для каталога workspace
  # ---------------------------------------------------------------------------
  workspace-init:
    image: docker.io/library/alpine:latest
    container_name: deepseek-workspace-init
    restart: "no"
    user: "0:0"
    command: sh -c "chown -R 1000:1000 /workspace && chmod 775 /workspace && rm -f /dsh/profiles/web/package.json.lock"
    volumes:
      - ${DSH_WORKSPACE:-./workspace}:/workspace
      - dsh-home:/dsh
    networks:
      - deepseek-net

  # ---------------------------------------------------------------------------
  # DeepSeek Harness (DSH): среда выполнения автономного AI агента DeepSeek
  # ---------------------------------------------------------------------------
  deepseek-harness:
    image: docker.io/runzhliu/deepseek-harness:${DSH_IMAGE_TAG:-0.2.0-rc.2-r1}
    container_name: deepseek-harness
    restart: unless-stopped
    command:
      - web
      - --patch
      - /opt/deepseek-harness/web.cordis.patch.yml
      - --no-open
      - --trusted-host
      - "${DSH_TRUSTED_HOST:-127.0.0.1}"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DSH_PORT:-3080}:3080"
      - "${HOST_BIND_IP:-127.0.0.1}:${DSH_DESKTOP_PORT:-6080}:6080"
    environment:
      DSH_TELEMETRY_DISABLED: "1"
      DSH_DESKTOP_ENABLED: "1"
      DSH_BROWSER_USE_ENABLED: "${DSH_BROWSER_USE_ENABLED:-1}"
      DSH_DESKTOP_PUBLIC_PORT: "${DSH_DESKTOP_PORT:-6080}"
      HOME: /workspace
      TZ: "${TZ:-Europe/Moscow}"
    volumes:
      - dsh-home:/home/node/.dsh
      - ${DSH_WORKSPACE:-./workspace}:/workspace
      - ./dsh-patches/browser-desktop-index.js:/opt/deepseek-harness/plugins/dsh-browser-desktop/index.js:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      omniroute:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:3080/'), fetch('http://127.0.0.1:6080/vnc.html'), fetch('http://127.0.0.1:9222/json/version')]).then(([web, desktop, cdp]) => { if (web.status !== 401 || !desktop.ok || !cdp.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    networks:
      - deepseek-net

  # ---------------------------------------------------------------------------
  # VS Code (code-server): веб-редактор для удобного доступа к workspace и .dsh
  # ---------------------------------------------------------------------------
  vscode:
    image: docker.io/codercom/code-server:latest
    container_name: deepseek-vscode
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if grep -q "/etc/code-server" /home/coder/.local/share/code-server/coder.json 2>/dev/null; then
          rm -f /home/coder/.local/share/code-server/coder.json
        fi
        cp -u /etc/code-server/deepseek.code-workspace /home/coder/deepseek.code-workspace 2>/dev/null || cp /etc/code-server/deepseek.code-workspace /home/coder/deepseek.code-workspace
        exec code-server \
          --bind-addr 0.0.0.0:8080 \
          --auth "$${VSCODE_AUTH:-none}" \
          $${VSCODE_CERT:+--cert} \
          --disable-telemetry \
          --disable-update-check \
          --disable-workspace-trust \
          /home/coder/deepseek.code-workspace
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${VSCODE_PORT:-8443}:8080"
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - PASSWORD=${VSCODE_PASSWORD:-}
      - VSCODE_AUTH=${VSCODE_AUTH:-none}
      - VSCODE_CERT=${VSCODE_CERT:-}
      - DOCKER_USER=coder
    volumes:
      - vscode-data:/home/coder
      - ${DSH_WORKSPACE:-./workspace}:/workspace
      - dsh-home:/dsh
      - ./deepseek.code-workspace:/etc/code-server/deepseek.code-workspace:ro
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    networks:
      - deepseek-net

  # ---------------------------------------------------------------------------
  # Laya: System 1 Decision Studio & REST API (быстрый инференс на ggmlc)
  # Собрано из форка https://github.com/andrei-tolstov/ggmlc
  # ---------------------------------------------------------------------------
  laya:
    build:
      context: ./laya
      dockerfile: Dockerfile
    container_name: deepseek-laya
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${LAYA_PORT:-8080}:8080"
      - "${HOST_BIND_IP:-127.0.0.1}:${LAYA_MCP_PORT:-8787}:8787"
    environment:
      - PORT=8080
      - MCP_PORT=${LAYA_MCP_PORT:-8787}
      - DEVICE=${LAYA_DEVICE:-auto}
      - MODEL_PATH=/models/laya_multilingual_f16.gguf
      - EXTRA_FLAGS=${LAYA_EXTRA_FLAGS:---cuda-graph}
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./models:/models
    networks:
      - deepseek-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health && curl -f http://localhost:8787/health" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s



  # ---------------------------------------------------------------------------
  # Backup: автоматическое резервное копирование данных на Google Диск через rclone
  # ---------------------------------------------------------------------------
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: deepseek-backup
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - RCLONE_CONFIG=/config/rclone/rclone.conf
      - RCLONE_REMOTE=${RCLONE_REMOTE:-gdrive}
      - RCLONE_DEST_FOLDER=${RCLONE_DEST_FOLDER:-backups/deepseek-stack}
      - RETENTION_DAYS=${RETENTION_DAYS:-14}
      - MIN_BACKUPS_TO_KEEP=${MIN_BACKUPS_TO_KEEP:-3}
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      - BACKUP_ON_STARTUP=${BACKUP_ON_STARTUP:-false}
    volumes:
      # Тома с данными для резервного копирования (в режиме только для чтения)
      - omniroute-data:/data/omniroute:ro
      - dsh-home:/data/dsh-home:ro
      - ${DSH_WORKSPACE:-./workspace}:/data/workspace:ro
      # Конфигурация и учетные данные rclone
      - ./backup:/config/rclone
    depends_on:
      - omniroute
      - deepseek-harness
    networks:
      - deepseek-net

networks:
  deepseek-net:
    name: deepseek-net
    driver: bridge

volumes:
  omniroute-data:
    name: deepseek_omniroute_data
  omniroute-redis-data:
    name: deepseek_redis_data
  dsh-home:
    name: deepseek_dsh_home
  vscode-data:
    name: deepseek_vscode_data
