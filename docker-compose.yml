services:
  qwen38-v100:
    build:
      context: ./ninfer-v100
      dockerfile: ../Dockerfile.v100
    image: ninfer-v100:cuda12.8
    container_name: qwen38-coder390-v100
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    shm_size: "16gb"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command:
      - "/models/model_v100.ninfer"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--max-context"
      - "240000"
      - "--prefill-chunk"
      - "2048"
      - "--kv-capacity"
      - "auto"
      - "--max-concurrency"
      - "1"
      - "--kv-dtype"
      - "int8"
      - "--device-state-slots"
      - "1"
      - "--host-state-slots"
      - "8"
      - "--host-kv-mib"
      - "8192"
      - "--spec"
      - "mtp"
      - "--draft-tokens"
      - "3"
      - "--lm-head-draft"
      - "--preserve-thinking"
