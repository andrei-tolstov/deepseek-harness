- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: omniroute
    model: qwen38/qwen3.8
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: laya
  name: "dsh-laya"
  config:
    sidecarUrl: "http://laya:8787"
    requestTimeoutMs: 120000
    lifecycle: never
    logLevel: info
- insert:
    - id: laya-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: laya
        transport: streamable-http
        url: "http://laya:8787/mcp"
        failOnStartupError: false
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- insert:
    - id: mcp-puppeteer
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: puppeteer
        transport: stdio
        command: npx
        args: [ "-y", "@modelcontextprotocol/server-puppeteer" ]
        env:
          PUPPETEER_BROWSER_URL: "http://127.0.0.1:9222"
        failOnStartupError: false

- id: ui-skill-explorer
  disabled: true

- id: telegram
  disabled: true

- id: messenger
  name: '@syncended/dsh-messenger'
  config:
    telegram:
      enabled: true
      tokenRef: TELEGRAM_BOT_TOKEN
      allowedChatIds:
        - '543497683'
      allowedUserIds:
        - '543497683'
      privateChatsOnly: true
      pollTimeoutSeconds: 30
      requestTimeoutMs: 15000
    voice:
      enabled: true
      model: small
      device: auto

- insert:
    - id: laya-tools
      name: "dsh-laya-tools"
      config:
        sidecarUrl: "http://laya:8787"
        hierarchical: false
        categorizationIntervalMs: 86400000
        maxTools: 50
        fallbackMode: "pass-all"
        enabled: true
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxActiveSubagents: 1

