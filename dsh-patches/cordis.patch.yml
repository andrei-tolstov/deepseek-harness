- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      omniroute:
        displayName: omniroute
        apiKeyEnv: OMNIROUTE_API_KEY
        api: openai-completions
        baseURL: http://192.168.50.101:20128/v1
        models:
          - id: qwen38/qwen3.8
            name: Qwen 3.8 27B (Local V100 180K)
            contextWindow: 180000
            maxTokens: 65536
            input:
              - text
              - image
          - id: qwen3.8
            name: Qwen 3.8 27B (Alias Local 180K)
            contextWindow: 180000
            maxTokens: 65536
            input:
              - text
              - image
          - id: xkiro/sensenova/sensenova-6.8-flash-lite
            name: SenseNova 6.8 Flash-Lite
            contextWindow: 262144
          - id: xkiro/mistralai/mistral-large-2512
            name: Mistral Large 3
            contextWindow: 256000
          - id: xkiro/qwen/qwen3.8-max:free
            name: Qwen3.8 Max
            contextWindow: 1000000
          - id: xkiro/cohere/command-a-plus
            name: cohere/command-a-plus
            contextWindow: 128000
          - id: xkiro/meituan/longcat-2.5-preview:free
            name: meituan/longcat-2.5-preview:free
            contextWindow: 128000
          - id: xkiro/inclusionai/ling-3.0-flash-sante:free
            name: inclusionai/ling-3.0-flash-sante:free
            contextWindow: 128000
          - id: xkiro/stealth/space-bunny-alpha:free
            name: stealth/space-bunny-alpha:free
            contextWindow: 128000
          - id: xkiro/liquid/lfm-2.5-2.6b:free
            name: liquid/lfm-2.5-2.6b:free
            contextWindow: 128000
          - id: xkiro/apodex/apodex-1.1-mini:free
            name: apodex/apodex-1.1-mini:free
            contextWindow: 128000
          - id: xkiro/dots-studio/dots-3-note-preview:free
            name: dots-studio/dots-3-note-preview:free
            contextWindow: 128000
          - id: bonsai2/bonsai2
            name: bonsai2
            contextWindow: 262144
            input:
              - text
              - image
          - id: qwen38/qwen3.8-27b
            name: Qwen 3.8 27B (Local V100 180K)
            contextWindow: 180000
            maxTokens: 65536
            input:
              - text
              - image
      self:
        displayName: self
        api: openai-completions
        baseURL: http://192.168.50.101:8081/v1
        models:
          - id: default
            name: Qwen 3.8 (Direct V100 180K)
            contextWindow: 180000
            maxTokens: 65536
            input:
              - text
              - image
          - id: qwen3.8
            name: Qwen 3.8 (Direct 180K)
            contextWindow: 180000
            maxTokens: 65536
            input:
              - text
              - image
          - id: qwen3.8-27b
            name: Qwen 3.8 27B (Direct 180K)
            contextWindow: 180000
            maxTokens: 65536
            input:
              - text
              - image
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: omniroute
    model: qwen38/qwen3.8
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: laya
  name: "dsh-laya"
  config:
    sidecarUrl: "http://laya:8787"
    requestTimeoutMs: 120000
    lifecycle: never
    logLevel: info
- insert:
    - id: laya-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: laya
        transport: streamable-http
        url: "http://laya:8787/mcp"
        failOnStartupError: false
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- insert:
    - id: mcp-puppeteer
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: puppeteer
        transport: stdio
        command: npx
        args: [ "-y", "@modelcontextprotocol/server-puppeteer" ]
        env:
          PUPPETEER_BROWSER_URL: "http://127.0.0.1:9222"
        failOnStartupError: false

- id: ui-skill-explorer
  disabled: true

- id: telegram
  disabled: true

- id: messenger
  name: '@syncended/dsh-messenger'
  config:
    telegram:
      enabled: true
      tokenRef: TELEGRAM_BOT_TOKEN
      allowedChatIds:
        - '543497683'
      allowedUserIds:
        - '543497683'
      privateChatsOnly: true
      pollTimeoutSeconds: 30
      requestTimeoutMs: 15000
    voice:
      enabled: true
      model: small
      device: auto

- insert:
    - id: laya-tools
      name: "dsh-laya-tools"
      config:
        sidecarUrl: "http://laya:8787"
        hierarchical: true
        categorizationIntervalMs: 86400000
        maxTools: 10
        fallbackMode: "pass-all"
        enabled: true
